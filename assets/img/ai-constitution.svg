<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic gradient for spiral -->
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#a8a8a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cyan glow for nodes -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cccc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0088aa;stop-opacity:0" />
    </radialGradient>
    
    <!-- Chain link gradient -->
    <linearGradient id="chainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00dddd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00aaaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008888;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="512" height="512" fill="none"/>
  
  <!-- Hexagonal chain structure -->
  <g id="hexagonChains">
    <!-- Chain links forming hexagon (6 sides) -->
    <!-- Side 1: Top to Top-Right -->
    <path d="M 256,80 L 400,160" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Side 2: Top-Right to Bottom-Right -->
    <path d="M 400,160 L 400,352" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Side 3: Bottom-Right to Bottom -->
    <path d="M 400,352 L 256,432" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Side 4: Bottom to Bottom-Left -->
    <path d="M 256,432 L 112,352" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Side 5: Bottom-Left to Top-Left -->
    <path d="M 112,352 L 112,160" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Side 6: Top-Left to Top -->
    <path d="M 112,160 L 256,80" stroke="url(#chainGradient)" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- Inner hexagon ring -->
    <path d="M 256,110 L 370,175 L 370,337 L 256,402 L 142,337 L 142,175 Z" 
          stroke="url(#chainGradient)" stroke-width="3" fill="none" opacity="0.6"/>
    
    <!-- Chain link details (small circles along edges) -->
    <g fill="url(#cyanGlow)" filter="url(#glow)">
      <!-- Top vertex -->
      <circle cx="256" cy="80" r="8"/>
      <!-- Top-Right vertex -->
      <circle cx="400" cy="160" r="8"/>
      <!-- Bottom-Right vertex -->
      <circle cx="400" cy="352" r="8"/>
      <!-- Bottom vertex -->
      <circle cx="256" cy="432" r="8"/>
      <!-- Bottom-Left vertex -->
      <circle cx="112" cy="352" r="8"/>
      <!-- Top-Left vertex -->
      <circle cx="112" cy="160" r="8"/>
      
      <!-- Midpoint nodes on each side -->
      <circle cx="328" cy="120" r="5" opacity="0.7"/>
      <circle cx="400" cy="256" r="5" opacity="0.7"/>
      <circle cx="328" cy="392" r="5" opacity="0.7"/>
      <circle cx="184" cy="392" r="5" opacity="0.7"/>
      <circle cx="112" cy="256" r="5" opacity="0.7"/>
      <circle cx="184" cy="120" r="5" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Central Open Spiral (Law 9 - The Open Horizon) -->
  <g id="openSpiral" transform="translate(256, 256)">
    <!-- Outer ribbon of spiral -->
    <path d="M 0,-90 
             C 35,-85 55,-60 50,-25 
             C 45,10 15,30 -20,35 
             C -55,40 -75,15 -70,-20 
             C -65,-55 -35,-75 0,-80
             M 0,-70
             C 25,-65 40,-45 35,-20
             C 30,5 10,20 -15,25
             C -40,30 -55,10 -50,-15
             C -45,-40 -25,-55 0,-60"
          fill="none" stroke="url(#metallicGradient)" stroke-width="12" 
          stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    
    <!-- Inner highlight for 3D effect -->
    <path d="M 0,-90 
             C 35,-85 55,-60 50,-25 
             C 45,10 15,30 -20,35 
             C -55,40 -75,15 -70,-20 
             C -65,-55 -35,-75 0,-80"
          fill="none" stroke="#ffffff" stroke-width="3" 
          stroke-linecap="round" opacity="0.6"/>
    
    <!-- Shadow for depth -->
    <path d="M 0,-70
             C 25,-65 40,-45 35,-20
             C 30,5 10,20 -15,25
             C -40,30 -55,10 -50,-15
             C -45,-40 -25,-55 0,-60"
          fill="none" stroke="#888888" stroke-width="2" 
          stroke-linecap="round" opacity="0.4"/>
    
    <!-- Spiral apex (open end at top) -->
    <path d="M -8,-95 L 8,-95" stroke="url(#metallicGradient)" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Additional glow effect on nodes -->
  <g filter="url(#glow)" opacity="0.8">
    <circle cx="256" cy="80" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="400" cy="160" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="400" cy="352" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="256" cy="432" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="112" cy="352" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="112" cy="160" r="12" fill="none" stroke="#00ffff" stroke-width="2"/>
  </g>
</svg>
